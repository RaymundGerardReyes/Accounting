upstream rge_dotnet_backend {
    server rge-accounting-dotnet:8080 max_fails=3 fail_timeout=5s;
    keepalive 64;
}

upstream rge_python_legacy {
    server rge-accounting-python:5000;
    keepalive 32;
}

# Canary split: route 100% of migrated v1 routes to .NET 10; instant rollback by flipping weight
split_clients "${request_id}" $strangler_upstream {
    100%    rge_dotnet_backend;
    *       rge_python_legacy;
}

server {
    listen 443 ssl http2;
    server_name accounting.rge.local;

    client_max_body_size 10M;

    # Hot-path PayMongo webhooks -> .NET 10 (< 50ms p99)
    location /api/v1/webhooks/paymongo {
        proxy_pass http://rge_dotnet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-Id $request_id;
    }

    # All API routes routed via Strangler Fig upstream selector
    location /api/ {
        proxy_pass http://$strangler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-Id $request_id;
    }
}

