# Heroku Cloud Native Buildpack (.NET) configuration.
# heroku/dotnet only auto-detects at the repo root, so a root-level solution
# (Rge.Accounting.Host.slnx) references the nested Host project.
schema-version = "0.2"

[com.heroku.buildpacks.dotnet]
solution_file = "Rge.Accounting.Host.slnx"
build_configuration = "Release"
