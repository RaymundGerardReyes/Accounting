name: "CD: Release Python Line (Line B)"

on:
  push:
    tags:
      - "python/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to manually release (e.g. python/v0.9.35)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-release-python:
    name: Build, Test, and Publish Python Line Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Version from Tag
        id: vars
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($rawTag)) {
              $rawTag = "${{ github.ref_name }}"
          }
          if (-not $rawTag.StartsWith("python/v")) {
              Write-Error "Invalid tag for Python line: $rawTag"
              exit 1
          }
          $version = $rawTag.Substring("python/v".Length)
          $shortSha = (git rev-parse --short HEAD).Trim()
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          Write-Host "Releasing Python Line: Version=$version, Tag=$rawTag, GitSha=$shortSha"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$rawTag" >> $env:GITHUB_OUTPUT
          echo "GIT_SHA=$shortSha" >> $env:GITHUB_OUTPUT
          echo "BUILD_TIME=$buildTime" >> $env:GITHUB_OUTPUT

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 20 & Pinned Next.js Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python Dependencies & Run Tests
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest || true

      - name: Build Next.js 15 Frontend
        working-directory: Frontend
        env:
          NEXT_PUBLIC_APP_LINE: "python"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.vars.outputs.VERSION }}
          NEXT_PUBLIC_GIT_SHA: ${{ steps.vars.outputs.GIT_SHA }}
          NEXT_PUBLIC_API_CONTRACT: "v1"
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.vars.outputs.BUILD_TIME }}
        run: |
          npm ci
          npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "R.G.E Accounting Platform (${{ steps.vars.outputs.TAG }})"
          body: |
            ## R.G.E Accounting Platform (FastAPI Legacy Maintenance) - ${{ steps.vars.outputs.TAG }}

            - **Release Line**: Line B (FastAPI Maintenance + Next.js 15)
            - **Application SemVer**: `${{ steps.vars.outputs.VERSION }}`
            - **Commit SHA**: `${{ steps.vars.outputs.GIT_SHA }}`
            - **API Contract**: `v1`
            - **Database Schema Level**: `V0001` (Alembic baseline)
            - **Build Timestamp**: `${{ steps.vars.outputs.BUILD_TIME }}`

            ### Maintenance Policy
            - Production support for legacy endpoints and live PayMongo payment orchestration.
            - Maintenance mode: PATCH-level fixes and critical security patches only.
          draft: false
          prerelease: false

