name: CI Build, Architecture & Security Gate

on:
  push:
    branches: [ main, develop, migrating-C# ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Backend/global.json

      - name: Restore Dependencies
        run: dotnet restore Backend/Rge.Accounting.slnx

      - name: Build Solution (Release - Warnings as Errors)
        run: dotnet build Backend/Rge.Accounting.slnx -c Release --no-restore

      - name: Run Modular Monolith Architecture & Zero-Float Tests
        run: dotnet test Backend/tests/Architecture.Tests/Rge.Architecture.Tests.csproj -c Release --no-build

      - name: Run Security, SoD & Cryptography Tests
        run: dotnet test Backend/tests/Security.Tests/Rge.Security.Tests.csproj -c Release --no-build

      - name: Run Golden-Master Contract Parity Tests
        run: dotnet test Backend/tests/Contract.Parity.Tests/Rge.Contract.Parity.Tests.csproj -c Release --no-build

