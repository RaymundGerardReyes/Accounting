# /etc/nginx/nginx.conf
# Acme Cost Accounting & Live Payment Orchestration
# Direct SSL Configuration with Cloudflare Origin CA

worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # 1. STRUCTURED SECURITY LOGGING (JSON)
    # =========================================================================
    log_format security_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"client_ip":"$remote_addr",'
      '"cf_ray":"$http_cf_ray",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"connection":"$connection",'
      '"tls":"$ssl_protocol",'
      '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/security_access.log security_json;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # 2. CLOUDFLARE REAL-IP RESTORATION
    # =========================================================================
    # Restores actual end-user IP from CF-Connecting-IP header.
    # Source: https://www.cloudflare.com/ips/
    # IPv4 CIDR blocks
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 CIDR blocks
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # =========================================================================
    # 3. RATE LIMITING & CONNECTION ZONES (Defense in Depth)
    # =========================================================================
    # Zone 1: Strict rate limit for API endpoints (Auth, Payments, Allocation)
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
    # Zone 2: Looser rate limit for Frontend UI bundles, assets, static pages
    limit_req_zone $binary_remote_addr zone=frontend_rate:10m rate=50r/s;
    # Zone 3: Maximum simultaneous TCP connections per IP
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # Basic performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    client_max_body_size 10M; # Prevent large payload attacks

    # =========================================================================
    # 4. UPSTREAM APPLICATION POOLS
    # =========================================================================
    upstream backend_nodes {
        server 127.0.0.1:5000; # FastAPI Backend
        keepalive 32;
    }

    upstream frontend_nodes {
        server 127.0.0.1:3000; # Next.js Frontend
        keepalive 32;
    }

    # =========================================================================
    # 5. PRIMARY VIRTUAL HOST (Cloudflare SSL Termination to Origin CA)
    # =========================================================================
    server {
        listen 443 ssl http2;
        server_name acme-finance.yourdomain.com;

        # Cloudflare Origin CA certificate and private key
        ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        server_tokens off; # Suppress NGINX version banner

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_conn per_ip_conn 30;

        # ---------------------------------------------------------------------
        # ROUTE 1A: DEDICATED HIGH-PRIORITY WEBHOOKS & INGESTION (/api/v1/)
        # ---------------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=api_rate burst=50 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Preserve exact raw body & cryptographic signature headers (unbuffered)
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Paymongo-Signature $http_paymongo_signature;
            proxy_set_header X-Google-Forms-Secret $http_x_google_forms_secret;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # ROUTE 1B: FASTAPI BACKEND (REST API & General)
        # ---------------------------------------------------------------------
        location /api/ {
            # Stricter rate limiting for API endpoints
            limit_req zone=api_rate burst=20 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Forward client identity and proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Google-Forms-Secret $http_x_google_forms_secret;
            proxy_set_header Paymongo-Signature $http_paymongo_signature;

            # Timeouts for heavy PostgreSQL queries & reporting aggregations
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # ROUTE 2: NEXT.JS FRONTEND (UI, React Server Components & Static)
        # ---------------------------------------------------------------------
        location / {
            # Looser rate limiting for fetching React bundles and static assets
            limit_req zone=frontend_rate burst=100 nodelay;

            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ---------------------------------------------------------------------
        # ROUTE 3: NGINX MONITORING & INTERNAL METRICS
        # ---------------------------------------------------------------------
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1; # Strictly loopback only
            deny all;
        }
    }

    # =========================================================================
    # 6. DEFAULT SERVER: REJECT UNMATCHED HOSTS / DIRECT IP PROBING
    # =========================================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
        return 444; # Drop connection immediately without HTTP response
    }
}
