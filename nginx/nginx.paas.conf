# /etc/nginx/nginx.paas.conf
# Acme Cost Accounting & Live Payment Orchestration
# PaaS / Container Environment Configuration (SSL terminated at Cloudflare / Edge Proxy)

worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # 1. STRUCTURED SECURITY LOGGING (JSON)
    # =========================================================================
    log_format security_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"client_ip":"$remote_addr",'
      '"cf_ray":"$http_cf_ray",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"connection":"$connection",'
      '"tls":"$ssl_protocol",'
      '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/security_access.log security_json;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # 2. CLOUDFLARE REAL-IP RESTORATION
    # =========================================================================
    # IPv4 CIDR blocks
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 CIDR blocks
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # Determine forwarded scheme from Cloudflare / PaaS Edge Proxy
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # =========================================================================
    # 3. RATE LIMITING & CONNECTION ZONES
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=frontend_rate:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    client_max_body_size 10M;

    # =========================================================================
    # 4. UPSTREAM APPLICATION POOLS
    # =========================================================================
    upstream backend_nodes {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    upstream frontend_nodes {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # =========================================================================
    # 5. SERVER BLOCK (HTTP entry point behind edge SSL)
    # =========================================================================
    server {
        # Default port 80 (or substituted with $PORT in container entrypoints)
        listen 80 default_server;
        server_name _;
        server_tokens off;

        # Strict Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_conn per_ip_conn 30;

        # ---------------------------------------------------------------------
        # ROUTE 1: FASTAPI BACKEND (REST API & Webhooks)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # ROUTE 2: NEXT.JS FRONTEND (UI & Static Assets)
        # ---------------------------------------------------------------------
        location / {
            limit_req zone=frontend_rate burst=100 nodelay;

            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ---------------------------------------------------------------------
        # ROUTE 3: CONTAINER HEALTH CHECK & NGINX MONITORING
        # ---------------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
